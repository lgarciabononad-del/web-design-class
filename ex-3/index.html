<!DOCTYPE html>
<html>
    <head>
        <title>oyster light</title>
        <link rel="stylesheet" href="style.css">
        <!-- this tag makes the website more responsive -->
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
    </head>
    <body>
    <div class="container">
        <!-- three invisible circles, one inside the other;the closer the cursor gets to the oyster, the more circles it is hovering -->
        <div class="ring1">
            <div class="ring2">
                <div class="ring3">
                    <div class="light"></div>
                    <div class="oyster"></div>
                </div>
            </div>
        </div>

        <p class="instructions">Move your cursor toward the oyster & resize the browser.</p>
    </div>

    </body>
</html>
